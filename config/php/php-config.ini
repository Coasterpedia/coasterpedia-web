# Error Logging
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
log_errors = On
error_log = /dev/stderr
display_errors = Off

# Upload Config
upload_max_filesize = 32M
post_max_size = 32M
; MediaWiki doesn't use upload progress. It was the main way in for php2shell
; (CVE-2026-109618/109619, October 2026): any POST reached it before MediaWiki ran.
session.upload_progress.enabled = Off