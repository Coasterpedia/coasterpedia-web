[www]
pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500
listen = /var/run/php-fpm.sock
listen.owner = www-data
listen.group = www-data

; Ladder: PHP 85s < nginx 90s < FPM hard kill 95s < Cloudflare 100s.
; PHP's own timer does not count time blocked in a DB query, so
; request_terminate_timeout is the backstop that actually reclaims a worker
; stuck on a long scan. Set here rather than php-config.ini so CLI
; maintenance scripts and the jobrunner stay unlimited.
php_admin_value[max_execution_time] = 85
request_terminate_timeout = 95s