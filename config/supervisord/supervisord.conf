[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
childlogdir=/tmp
pidfile = /tmp/supervisord.pid

; Graceful stop on deploy. SIGQUIT is the graceful signal for both (SIGTERM,
; supervisord's default, makes php-fpm drop requests mid-flight). Supervisord
; stops the higher priority first and waits for it, so nginx stops taking
; connections and finishes its in-flight requests while php-fpm is still there
; to answer them, then php-fpm goes. Both waits together stay inside
; stop_grace_period in docker-compose.yml; a request still running after that
; is cut off as before.

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=0
priority=10
stopsignal=QUIT
stopwaitsecs=5

[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=0
priority=20
stopsignal=QUIT
stopwaitsecs=20
