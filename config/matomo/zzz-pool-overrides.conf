[www]
; Matomo's web UI never needs to run a program. It shells out only to probe
; the system (whoami, uname -a, ps wwx | awk, df -T -t nfs, groups,
; php -r 'echo phpversion();' on the Diagnostics page, all of which Falco
; reports as a webshell would) and to background-launch console commands,
; which it skips when shell_exec is missing: function_exists() is false for a
; disabled function since PHP 8. Set here rather than in php.ini so the CLI
; keeps them: core:archive (ofelia) runs its parallel requests through them.
; mail is listed because it runs sendmail; Matomo sends over SMTP.
; Diagnostics now shows shell_exec as a missing recommended function.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,mail
