# Overrides for the image's /etc/falco/falco.yaml, loaded from config.d.
# Only keys that differ from upstream are set here.

# Drop informational/debug events; notice and above still reach stdout
# (`docker compose logs falco`). Falcosidekick decides what is emailed or paged.
priority: notice

json_output: true
json_include_output_property: true
json_include_tags_property: true

http_output:
  enabled: true
  url: http://falcosidekick:2801/
