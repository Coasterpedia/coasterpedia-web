log_format detailed '$http_x_forwarded_for - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'tier=$cp_tier rl=$limit_req_status';

# --- API rate limiting ---------------------------------------------------------
# Modelled on Wikimedia's API limits, scaled down. Counts requests to api.php and
# rest.php per client per minute:
#   internal  no Cloudflare client IP (container-to-container, e.g. Services)  exempt
#   user      logged-in cookie present                                        1000/min
#   anon      browsers and bots with their own User-Agent                      100/min
#   generic   no User-Agent, or a library default (curl, python-requests, ...)  10/min
# The login cookie is only a hint (it can be forged); it earns a higher limit,
# never an exemption.
#
# $remote_addr is always the front proxy, so the client is taken from
# CF-Connecting-IP, which Cloudflare sets and overwrites, else the last
# X-Forwarded-For entry. Not via real_ip: MediaWiki resolves the client itself
# from X-Forwarded-For and needs the proxy as REMOTE_ADDR.
map $http_x_forwarded_for $cp_xff_client {
    "~(?<last>[^,\s]+)\s*$" $last;
    default                  "";
}
map $http_cf_connecting_ip $cp_client {
    ""      $cp_xff_client;
    default $http_cf_connecting_ip;
}
map $http_cookie $cp_logged_in {
    "~(?:^|;\s*)coasterpedia_mw_User(?:Name|ID)=" 1;
    default                                      0;
}
map $http_user_agent $cp_generic_ua {
    ""  1;
    "~*^(?:curl|wget|python-|python/|aiohttp|httpx|go-http-client|java/|okhttp|libwww-perl|php/|guzzlehttp|node-fetch|axios|undici|node/|deno|ruby|scrapy|dart/|reqwest|apache-httpclient|postmanruntime)" 1;
    default 0;
}
map "$cp_client:$cp_logged_in$cp_generic_ua" $cp_tier {
    "~^:"    internal;
    "~:1.$"  user;
    "~:01$"  generic;
    default  anon;
}
# One zone per tier; a request only counts against the zone whose key is set.
map $cp_tier $cp_key_user    { user    $cp_client; default ""; }
map $cp_tier $cp_key_anon    { anon    $cp_client; default ""; }
map $cp_tier $cp_key_generic { generic $cp_client; default ""; }
limit_req_zone $cp_key_user    zone=api_user:10m    rate=1000r/m;
limit_req_zone $cp_key_anon    zone=api_anon:10m    rate=100r/m;
limit_req_zone $cp_key_generic zone=api_generic:10m rate=10r/m;
limit_req_status 429;

server {
    server_name _;
    listen 80 default_server;
    root /var/www/html;
    index index.php;
    port_in_redirect off;

    client_max_body_size 32m;
    client_body_timeout 60;

    access_log /dev/stdout detailed;
    error_log /dev/stdout;

    # Rate-limited API requests get a JSON error both API styles can parse, and
    # no Cache-Control, so Cloudflare never caches it.
    error_page 429 @ratelimited;
    location @ratelimited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":{"code":"ratelimited","info":"Too many API requests. Slow down, or identify your client with a User-Agent that includes contact details."}}';
    }

    # FastCGI defaults applied to all FastCGI locations
    fastcgi_keep_conn on;
    fastcgi_read_timeout 30s;
    fastcgi_send_timeout 30s;
    fastcgi_connect_timeout 10s;
    # Responses too big for the in-memory buffers spill to /var/lib/nginx/tmp,
    # which is a 512m tmpfs. Past this size nginx streams the rest instead of
    # buffering it, so one large response can't fill the tmpfs (default 1024m).
    fastcgi_max_temp_file_size 128m;
    proxy_max_temp_file_size 128m;

    # Allow robots.txt in case you have one
    # An explicit expiry keeps this (and favicon.ico below) cacheable: the
    # Cloudflare cache rule for coasterpedia.net bypasses anything the origin
    # sends without Cache-Control.
    location = /robots.txt {
        expires 1d;
    }

    # Special pages (ReplaceText, Nuke, Export) can run unindexed scans over the
    # whole text table, well past the 30s default. Held under Cloudflare's 100s
    # proxy limit so nginx times out first with a real error page, not a 524.
    # Exact/^~ matches win over the regex locations below regardless of order.
    location = /w/index.php {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_read_timeout 90s;
    }

    location ^~ /wiki/Special: {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/w/index.php;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_read_timeout 90s;
    }

    # Exact match, so it wins over the regex below.
    location = /w/api.php {
        limit_req zone=api_user burst=200 nodelay;
        limit_req zone=api_anon burst=50 nodelay;
        limit_req zone=api_generic burst=10 nodelay;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php-fpm.sock;
    }

    location ~ ^/w/(load|thumb|opensearch_desc|img_auth)\.php$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php-fpm.sock;
    }

    location ~ ^/w/rest\.php(/|$) {
        limit_req zone=api_user burst=200 nodelay;
        limit_req zone=api_anon burst=50 nodelay;
        limit_req zone=api_generic burst=10 nodelay;
        include /etc/nginx/fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass unix:/var/run/php-fpm.sock;
    }

    # Images
    location /w/images {
        # Separate location for images/ so .php execution won't apply
    }
    location /w/images/deleted {
        deny all;
    }
    location = /w/LocalSettings.php {
        deny all;
    }
    # MediaWiki assets (usually images)
    location ~ ^/w/resources/(assets|lib|src) {
        try_files $uri 404;
        add_header Cache-Control "public";
        expires 7d;
    }
    # Assets, scripts and styles from skins and extensions
    location ~ ^/w/(skins|extensions)/.+\.(css|js|gif|jpg|jpeg|png|svg|wasm|ttf|woff|woff2)$ {
        try_files $uri 404;
        add_header Cache-Control "public";
        expires 7d;
    }
    # Favicon
    location = /favicon.ico {
        expires 7d;
    }

    # License and credits files
    location ~ ^/w/(COPYING|CREDITS)$ {
        default_type text/plain;
    }

    location ~ /\.(svn|git)(/|$) { deny all; }
    location ~ /\.ht { deny all; }
    location /w/mw-config { deny all; }

    # Main wiki entry point
    location /wiki/ {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/w/index.php;
        fastcgi_pass unix:/var/run/php-fpm.sock;
    }

    location = / {
        return 301 /wiki/Main_Page;
    }

    # ImageFetch service (CoasterpediaServices/InternalApi container)
    location = /imagefetch {
        resolver 127.0.0.11 valid=30s ipv6=off;      # Docker's embedded DNS
        set $imagefetch_upstream coasterpedia-services;
        proxy_pass http://$imagefetch_upstream:8080/imagefetch;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
