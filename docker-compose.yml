services:
  mariadb:
    # Pinned by digest (Renovate raises the bumps), so a deploy only restarts
    # the database when an upgrade is merged, not whenever the tag has moved.
    image: mariadb:11.8.9@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      CARGO_MYSQL_PASSWORD: ${CARGO_MYSQL_PASSWORD}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DATABASE_PASSWORD}
      COASTERPEDIA_TOOLS_MYSQL_PASSWORD: ${COASTERPEDIA_TOOLS_MYSQL_PASSWORD}
      BACKUP_MYSQL_PASSWORD: ${BACKUP_MYSQL_PASSWORD}
    networks:
      - db
      - analytics
      - backup
    ports:
      - "100.126.37.32:3306:3306"
    volumes:
    - mariadb:/var/lib/mysql
    - ./config/mariadb/mariadb.cnf:/etc/mysql/conf.d/mariadb.cnf:ro
    - ./config/mariadb/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
  mediawiki:
    image: ghcr.io/coasterpedia/coasterpedia-web/mediawiki@${MEDIAWIKI_IMAGE}
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem: the code, config and binaries can't be changed at
    # runtime. Writable paths are the ones a docker diff showed in normal use.
    # www-data is uid/gid 82 in the Alpine image.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m               # PHP uploads and temp files, supervisord
      - /run:uid=82,gid=82,mode=0755,size=16m  # php-fpm socket
      - /run/nginx:uid=82,gid=82,size=1m       # nginx pid
      - /var/lib/nginx/tmp:uid=82,gid=82,size=512m  # upload bodies and buffered responses
      - /var/log/nginx:uid=82,gid=82,size=16m
      - /home/www-data:uid=82,gid=82,size=16m
    networks:
      - web
      - db
      - search
    depends_on:
      - mariadb
      - redis
      - opensearch
    # Ready once MediaWiki answers an API request, which also reaches the
    # database; deploy.yml waits on this. X-Forwarded-Proto stops the
    # $wgForceHTTPS redirect. No client IP header, so the rate limits skip it.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "X-Forwarded-Proto: https",
             "http://127.0.0.1/w/api.php?action=query&meta=siteinfo&format=json"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s
    # Room for the graceful stop in config/supervisord/supervisord.conf.
    stop_grace_period: 30s
    volumes:
      - ./config/mediawiki/LocalSettings.php:/var/www/html/w/LocalSettings.php:ro
      - ./config/nginx/coasterpedia.conf:/etc/nginx/http.d/default.conf:ro
      - /var/cache/mediawiki   # $wgCacheDirectory; anonymous, renewed on each deploy
    ports:
      -  127.0.0.1:9001:80
    environment:
      MYSQL_DATABASE: coasterpedia
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_SERVER: mariadb
      MYSQL_USER: coasterpedia
      CARGO_MYSQL_DATABASE: cargo_db
      CARGO_MYSQL_PASSWORD: ${CARGO_MYSQL_PASSWORD}
      CARGO_MYSQL_SERVER: mariadb
      CARGO_MYSQL_USER: cargo_user
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_ACCESS_SECRET: ${R2_ACCESS_SECRET}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      SECRET_KEY: ${SECRET_KEY}
      ES_IP: opensearch
      OAUTH_PUBLIC: ${OAUTH_PUBLIC}
      OAUTH_PRIVATE: ${OAUTH_PRIVATE}
      CLOUDFLARE_ZONEID: ${CLOUDFLARE_ZONEID}
      CLOUDFLARE_APITOKEN: ${CLOUDFLARE_APITOKEN}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
      MATOMO_API_KEY: ${MATOMO_API_KEY}
  redis:
    # Pinned by digest, as for mariadb.
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - web
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - redis:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
  opensearch:
    image: ghcr.io/coasterpedia/coasterpedia-web/opensearch@${OPENSEARCH_IMAGE}
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true # Disable JVM heap memory swapping
      # - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" # Set min and max JVM heap sizes to at least 50% of system RAM
    ulimits:
      memlock:
        soft: -1 # Set memlock to unlimited (no soft or hard limit)
        hard: -1
      nofile:
        soft: 65536 # Maximum number of open files for the opensearch user - set to at least 65536
        hard: 65536
    volumes:
      - opensearch:/usr/share/opensearch/data # Creates volume called opensearch-data1 and mounts it to the container
    networks:
      - search
  jobrunner-chron:
    image: ghcr.io/coasterpedia/coasterpedia-web/jobrunner@${JOBRUNNER_IMAGE}
    restart: unless-stopped
    init: true
    user: "www-data:www-data"
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem, as for mediawiki.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m
      - /home/www-data:uid=82,gid=82,size=16m
    depends_on:
      - mediawiki
      - redis
      - mariadb
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/mediawiki/LocalSettings.php:/var/www/html/w/LocalSettings.php:ro
      - /var/cache/mediawiki   # $wgCacheDirectory; anonymous, renewed on each deploy
    networks:
      - web
      - db
      - search
    environment:
      RUNNER_TYPE: Chron
      MYSQL_DATABASE: coasterpedia
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_SERVER: mariadb
      MYSQL_USER: coasterpedia
      CARGO_MYSQL_DATABASE: cargo_db
      CARGO_MYSQL_PASSWORD: ${CARGO_MYSQL_PASSWORD}
      CARGO_MYSQL_SERVER: mariadb
      CARGO_MYSQL_USER: cargo_user
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_ACCESS_SECRET: ${R2_ACCESS_SECRET}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      SECRET_KEY: ${SECRET_KEY}
      ES_IP: opensearch
      OAUTH_PUBLIC: ${OAUTH_PUBLIC}
      OAUTH_PRIVATE: ${OAUTH_PRIVATE}
      CLOUDFLARE_ZONEID: ${CLOUDFLARE_ZONEID}
      CLOUDFLARE_APITOKEN: ${CLOUDFLARE_APITOKEN}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
      MATOMO_API_KEY: ${MATOMO_API_KEY}
  jobrunner:
    image: ghcr.io/coasterpedia/coasterpedia-web/jobrunner@${JOBRUNNER_IMAGE}
    restart: unless-stopped
    init: true
    user: "www-data:www-data"
    cpu_shares: 256
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem, as for mediawiki.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m
      - /home/www-data:uid=82,gid=82,size=16m
    depends_on:
      - mediawiki
      - redis
      - mariadb
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/mediawiki/LocalSettings.php:/var/www/html/w/LocalSettings.php:ro
      - /var/cache/mediawiki   # $wgCacheDirectory; anonymous, renewed on each deploy
    networks:
      - web
      - db
      - search
    environment:
      MYSQL_DATABASE: coasterpedia
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_SERVER: mariadb
      MYSQL_USER: coasterpedia
      CARGO_MYSQL_DATABASE: cargo_db
      CARGO_MYSQL_PASSWORD: ${CARGO_MYSQL_PASSWORD}
      CARGO_MYSQL_SERVER: mariadb
      CARGO_MYSQL_USER: cargo_user
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_ACCESS_SECRET: ${R2_ACCESS_SECRET}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      SECRET_KEY: ${SECRET_KEY}
      ES_IP: opensearch
      OAUTH_PUBLIC: ${OAUTH_PUBLIC}
      OAUTH_PRIVATE: ${OAUTH_PRIVATE}
      CLOUDFLARE_ZONEID: ${CLOUDFLARE_ZONEID}
      CLOUDFLARE_APITOKEN: ${CLOUDFLARE_APITOKEN}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
      MATOMO_API_KEY: ${MATOMO_API_KEY}
  matomo:
    image: ghcr.io/coasterpedia/coasterpedia-web/matomo@${MATOMO_IMAGE}
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem; writable paths from a docker diff of the running
    # container, plus Matomo's own tmp/ and misc/ volumes below.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m                # supervisord
      - /run:uid=82,gid=82,mode=0755,size=16m
      - /run/nginx:uid=82,gid=82,size=1m       # nginx pid
      - /var/lib/nginx/tmp:uid=82,gid=82,size=128m
      - /var/log/nginx:uid=82,gid=82,size=16m
    networks:
      - analytics
    depends_on:
      - mariadb
    volumes:
      - ./config/nginx/matomo.conf:/etc/nginx/http.d/matomo.conf:ro
      - /usr/src/matomo/tmp    # caches; anonymous, renewed on each deploy
      - /usr/src/matomo/misc   # GeoIP database downloads; same
    ports:
      - 127.0.0.1:9002:80
    environment:
      MATOMO_DATABASE_DBNAME: coasterpedia_analytics
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DATABASE_PASSWORD}
      MATOMO_DATABASE_HOST: mariadb
      MATOMO_DATABASE_USERNAME: coasterpedia_analytics
      MATOMO_EMAIL_HOST: ${SMTP_HOST}
      MATOMO_EMAIL_USERNAME: ${SMTP_USER}
      MATOMO_EMAIL_PASSWORD: ${SMTP_PASSWORD}
  ofelia:
    image: mcuadros/ofelia:0.3
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    network_mode: none
    depends_on:
      - mediawiki
      - matomo
      - dr
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/ofelia/ofelia.ini:/etc/ofelia/config.ini:ro
  dr:
    image: ghcr.io/coasterpedia/coasterpedia-web/dr@${DR_IMAGE}
    restart: unless-stopped
    init: true
    user: "dr:dr"
    security_opt:
      - no-new-privileges:true
    environment:
      DB_HOST: mariadb
      # Split: the wiki set is dumped daily and is what binlog replay can roll
      # forward; Matomo is dumped weekly by its own job. See dr/backup.sh.
      DB_NAME: coasterpedia cargo_db coasterpedia_tools
      DB_NAME_ANALYTICS: coasterpedia_analytics
      AGE_RECIPIENT: ${AGE_RECIPIENT}
      R2_REMOTE: ${R2_REMOTE}
      HC_URL: ${HC_BASE_BACKUP_URL}
      HC_ANALYTICS_URL: ${HC_ANALYTICS_BACKUP_URL}
      RCLONE_CONFIG: /secrets/rclone.conf
      DEFAULTS_FILE: /secrets/backup.cnf
      WORKDIR: /work
    depends_on:
      - mariadb
    volumes:
      - ../coasterpedia-secrets:/secrets:ro      # backup.cnf + rclone.conf (git-ignored)
      - dr-work:/work
    networks:
      - backup
  # Runtime detection: watches syscalls on the host through eBPF and flags what
  # an attacker does once in (commands run by PHP, dropped files, secrets read).
  # Rules: config/falco/coasterpedia_rules.yaml. Alerts go to falcosidekick.
  falco:
    image: falcosecurity/falco:0.45.0
    restart: always
    # The documented least-privilege set for the modern eBPF driver. SYS_ADMIN
    # stands in for BPF + PERFMON, which Docker can't grant separately yet.
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
      - no-new-privileges:true
    networks:
      - falco
    depends_on:
      - falcosidekick
    volumes:
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      # For container names in alerts. :ro only stops the socket file being
      # replaced, not API calls: Falco is trusted with the Docker API, like ofelia.
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - ./config/falco/falco.yaml:/etc/falco/config.d/coasterpedia.yaml:ro
      - ./config/falco/coasterpedia_rules.yaml:/etc/falco/rules.d/coasterpedia_rules.yaml:ro
      - falco-events:/var/log/falco   # alert history that survives redeploys
  # Routes Falco's alerts by priority: ALERT pages through PagerDuty, WARNING
  # and above are emailed. PagerDuty is off while FALCO_PAGERDUTY_ROUTINGKEY is
  # unset, which is how the learning period runs.
  falcosidekick:
    image: falcosecurity/falcosidekick:2.35.0
    restart: always
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - falco
      - alerts
    environment:
      PAGERDUTY_ROUTINGKEY: ${FALCO_PAGERDUTY_ROUTINGKEY:-}
      PAGERDUTY_REGION: ${FALCO_PAGERDUTY_REGION:-us}
      PAGERDUTY_MINIMUMPRIORITY: alert
      SMTP_HOSTPORT: ${SMTP_HOST}:587
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: wiki@coasterpedia.net
      SMTP_TO: ${SECURITY_ALERT_EMAIL}
      SMTP_MINIMUMPRIORITY: warning
networks:
  # Split so a compromised container reaches only what it needs (see the
  # 2026-09-27 incident). `web` keeps its name: CoasterpediaServices joins it
  # as the external network `coasterpedia_web`.
  web:        # app tier: mediawiki, job runners, redis, coasterpedia-services
  search:     # opensearch and its clients; no internet access needed
    internal: true
  db:         # mariadb and the wiki's clients; not internal, as mariadb
              # publishes a port on the Tailscale address
  analytics:  # matomo and its database
  backup:     # dr and the database it dumps
  falco:      # falco to falcosidekick only; Falco needs no internet access
    internal: true
  alerts:     # falcosidekick's way out to PagerDuty and SMTP
volumes:
  redis:
  dr-work:
  mariadb:
  opensearch:
  falco-events: