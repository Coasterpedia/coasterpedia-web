name: Docker
on:
  # Weekly rebuild so upstream security fixes (the base image and every
  # REL1_46 branch clone) reach production without waiting for a code change.
  # GitHub runs schedules from the DEFAULT branch's copy of this file, so the
  # default branch must be develop for this to build the right code.
  schedule:
    - cron: '23 4 * * 1'
  # Manual rebuild, e.g. after a security announcement.
  workflow_dispatch:
  push:
    branches: [ "main", "develop" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  # PRs into develop (Renovate's extension bumps among them) are built but never
  # pushed or deployed, so a bump that breaks the build or a hotfix patch fails
  # here rather than on merge.
  pull_request:
    branches: [ "main", "develop" ]

env:
  REGISTRY: ghcr.io

jobs:
  mediawiki_build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: coasterpedia/coasterpedia-web/mediawiki

    outputs:
      digest: ${{steps.build-and-push.outputs.digest}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Mediawiki
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-mediawiki
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}-mediawiki-v2
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-mediawiki-v2
          platforms: linux/arm64
          target: mediawiki

  matomo_build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: coasterpedia/coasterpedia-web/matomo

    outputs:
      digest: ${{steps.build-and-push.outputs.digest}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-matomo
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}-matomo
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-matomo
          platforms: linux/arm64

  jobrunner_build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: coasterpedia/coasterpedia-web/jobrunner

    outputs:
      digest: ${{steps.build-and-push.outputs.digest}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-mediawiki
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}-mediawiki-v2
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-mediawiki-v2
          platforms: linux/arm64
          target: jobrunner
  
  dr_build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: coasterpedia/coasterpedia-web/dr

    outputs:
      digest: ${{steps.build-and-push.outputs.digest}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-dr
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}-dr
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-dr
          platforms: linux/arm64

  opensearch_build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: coasterpedia/coasterpedia-web/opensearch
      TAG: v1.3.20-12

    outputs:
      # The image already built for this TAG when there is one, else the new build.
      digest: ${{ steps.existing.outputs.digest || steps.build-and-push.outputs.digest }}

    steps:
      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every build gets a new digest, even from unchanged inputs (the metadata
      # labels carry the build time and commit), and compose restarts a service
      # whenever its digest changes, so rebuilding here on each push restarted
      # OpenSearch on every deploy. Pushes reuse the image already built for
      # this TAG instead. The weekly and manual runs still rebuild it from
      # scratch for base image fixes, and restart search when they deploy.
      - name: Look up image for this tag
        id: existing
        if: github.event_name == 'push'
        run: |
          digest=$(docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:$TAG" --format '{{.Manifest.Digest}}' 2>/dev/null) || digest=
          echo "Existing image for $TAG: ${digest:-none, building}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.existing.outputs.digest == ''
        run: git clone https://gitlab.wikimedia.org/repos/search-platform/cirrussearch-opensearch-image.git -b ${{ env.TAG }}

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        if: steps.existing.outputs.digest == ''
        uses: docker/setup-buildx-action@v3

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      # The defaults, plus TAG itself from develop for the lookup above. Not
      # from main, which is stale and must not replace production's image.
      - name: Extract Docker metadata
        id: meta
        if: steps.existing.outputs.digest == ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=${{ env.TAG }},enable=${{ github.ref == 'refs/heads/develop' }}

      # Swap private Wikimedia mirrors for public Debian mirrors
      - name: Patch apt repositories
        if: steps.existing.outputs.digest == ''
        run: |
          cd cirrussearch-opensearch-image
          if [ -f .pipeline/blubber.yaml ]; then
            sed -i 's|docker-registry.wikimedia.org/bookworm:20241006|debian:bookworm|g' .pipeline/blubber.yaml
          fi


      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: ./cirrussearch-opensearch-image
          file: ./cirrussearch-opensearch-image/.pipeline/blubber.yaml
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}-opensearch
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-opensearch
          platforms: linux/arm64

  falco_rules:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # A rule that fails to compile stops Falco from starting, which would
      # silently leave the server unmonitored, so check before deploying.
      - name: Validate Falco rules
        run: |
          image=$(sed -n 's/^ *image: \(falcosecurity\/falco:.*\)$/\1/p' docker-compose.yml)
          docker run --rm --entrypoint falco \
            -v "$PWD/config/falco/falco.yaml:/etc/falco/config.d/coasterpedia.yaml:ro" \
            -v "$PWD/config/falco/coasterpedia_rules.yaml:/etc/falco/rules.d/coasterpedia_rules.yaml:ro" \
            "$image" \
            -V /etc/falco/falco_rules.yaml -V /etc/falco/rules.d/coasterpedia_rules.yaml

  deploy:
    runs-on: ubuntu-latest
    needs: [mediawiki_build, matomo_build, jobrunner_build, dr_build, opensearch_build, falco_rules]
    # Production runs develop. Images built from any other branch (main is far
    # behind and would roll back security fixes) or from a PR are never deployed.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    permissions:
      contents: write
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Record deployed digests
        run: |
          cat > versions.env <<EOF
          MEDIAWIKI_IMAGE=${{needs.mediawiki_build.outputs.digest}}
          JOBRUNNER_IMAGE=${{needs.jobrunner_build.outputs.digest}}
          MATOMO_IMAGE=${{needs.matomo_build.outputs.digest}}
          DR_IMAGE=${{needs.dr_build.outputs.digest}}
          OPENSEARCH_IMAGE=${{needs.opensearch_build.outputs.digest}}
          EOF
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.env
          if ! git diff --staged --quiet; then
            git commit -m "chore: record deployed digests [skip ci]"
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DOCKER_SSH_2_PRIVATE_KEY }}
          known_hosts: ${{ secrets.DOCKER_SSH_2_KNOWN_HOSTS }}
      - name: Write secret files
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          BACKUP_CNF: ${{ secrets.BACKUP_CNF }}
        run: |
          mkdir -p secret_files
          printf '%s' "$RCLONE_CONF" > secret_files/rclone.conf
          printf '%s' "$BACKUP_CNF" > secret_files/backup.cnf
          chmod 600 secret_files/*

      - name: Ensure remote secrets dir exists
        run: ssh ${{ secrets.DOCKER_HOST_2 }} 'mkdir -p coasterpedia-secrets'

      - name: Copy secret files to server
        run: |
          scp -p secret_files/rclone.conf ${{ secrets.DOCKER_HOST_2 }}:coasterpedia-secrets/rclone.conf
          scp -p secret_files/backup.cnf ${{ secrets.DOCKER_HOST_2 }}:coasterpedia-secrets/backup.cnf
          ssh ${{ secrets.DOCKER_HOST_2 }} 'setfacl -m u:1000:rw coasterpedia-secrets/*'
          rm -rf secret_files

      - name: Deploy to server
        run: >
          ssh ${{ secrets.DOCKER_HOST_2 }} '
            export MEDIAWIKI_IMAGE="${{needs.mediawiki_build.outputs.digest}}" &&
            export MATOMO_IMAGE="${{needs.matomo_build.outputs.digest}}" &&
            export JOBRUNNER_IMAGE="${{needs.jobrunner_build.outputs.digest}}" &&
            export DR_IMAGE="${{needs.dr_build.outputs.digest}}" &&
            export OPENSEARCH_IMAGE="${{needs.opensearch_build.outputs.digest}}" &&
            export MYSQL_PASSWORD="${{secrets.MYSQL_PASSWORD}}" &&
            export CARGO_MYSQL_PASSWORD="${{secrets.CARGO_MYSQL_PASSWORD}}" &&
            export SMTP_HOST="${{secrets.SMTP_HOST}}" &&
            export SMTP_USER="${{secrets.SMTP_USER}}" &&
            export SMTP_PASSWORD="${{secrets.SMTP_PASSWORD}}" &&
            export R2_ACCESS_KEY="${{secrets.R2_ACCESS_KEY}}" &&
            export R2_ACCESS_SECRET="${{secrets.R2_ACCESS_SECRET}}" &&
            export R2_BUCKET_NAME="${{secrets.R2_BUCKET_NAME}}" &&
            export R2_ENDPOINT="${{secrets.R2_ENDPOINT}}" &&
            export OAUTH_PRIVATE="${{secrets.OAUTH_PRIVATE}}" &&
            export OAUTH_PUBLIC="${{secrets.OAUTH_PUBLIC}}" &&
            export MATOMO_DATABASE_PASSWORD="${{secrets.MATOMO_DATABASE_PASSWORD}}" &&
            export MATOMO_API_KEY="${{secrets.MATOMO_API_KEY}}" &&
            export SECRET_KEY="${{secrets.SECRET_KEY}}" &&
            export ES_IP="${{secrets.ES_IP}}" &&
            export CLOUDFLARE_ZONEID="${{secrets.CLOUDFLARE_ZONEID}}" &&
            export CLOUDFLARE_APITOKEN="${{secrets.CLOUDFLARE_APITOKEN}}" &&
            export TURNSTILE_SECRET="${{secrets.TURNSTILE_SECRET}}" &&
            export AGE_RECIPIENT="${{secrets.AGE_RECIPIENT}}" &&
            export R2_REMOTE="${{secrets.BACKUP_R2_REMOTE}}" &&
            export HC_BASE_BACKUP_URL="${{secrets.HC_BASE_BACKUP_URL}}" &&
            export MARIADB_ROOT_PASSWORD="${{secrets.MARIADB_ROOT_PASSWORD}}" &&
            export COASTERPEDIA_TOOLS_MYSQL_PASSWORD="${{secrets.COASTERPEDIA_TOOLS_MYSQL_PASSWORD}}" &&
            export BACKUP_MYSQL_PASSWORD="${{secrets.BACKUP_MYSQL_PASSWORD}}" &&
            export SECURITY_ALERT_EMAIL="${{secrets.SECURITY_ALERT_EMAIL}}" &&
            export FALCO_PAGERDUTY_ROUTINGKEY="${{secrets.FALCO_PAGERDUTY_ROUTINGKEY}}" &&
            export FALCO_PAGERDUTY_REGION="${{secrets.FALCO_PAGERDUTY_REGION}}" &&
            if [ -d coasterpedia/.git ]; then cd coasterpedia && git pull; else git clone --depth 1 -b develop https://github.com/${{ github.repository }} coasterpedia && cd coasterpedia; fi &&
            docker compose pull &&
            docker compose up -d -V --wait --wait-timeout 300 &&
            docker compose exec -T -u www-data mediawiki php maintenance/run.php purgeMessageBlobStore &&
            docker system prune -f &&
            docker volume prune -f
          '